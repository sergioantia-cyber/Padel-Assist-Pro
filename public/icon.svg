<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="padelGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4edea3" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="racketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ffbbe"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#005236"/>
    </linearGradient>
    <linearGradient id="ballGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="#09090b"/>
  <circle cx="256" cy="256" r="230" fill="url(#padelGlow)"/>

  <!-- Outer Neon Ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#10b981" stroke-width="4" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="256" cy="256" r="200" fill="#181b25" stroke="#31353f" stroke-width="3"/>

  <!-- Padel Racket Head -->
  <ellipse cx="256" cy="210" rx="100" ry="115" fill="url(#racketGrad)" stroke="#6ffbbe" stroke-width="4"/>
  
  <!-- Racket Perforations (Holes) -->
  <g fill="#0f131c" opacity="0.85">
    <circle cx="226" cy="180" r="7"/>
    <circle cx="256" cy="180" r="7"/>
    <circle cx="286" cy="180" r="7"/>
    <circle cx="210" cy="210" r="7"/>
    <circle cx="240" cy="210" r="7"/>
    <circle cx="272" cy="210" r="7"/>
    <circle cx="302" cy="210" r="7"/>
    <circle cx="226" cy="240" r="7"/>
    <circle cx="256" cy="240" r="7"/>
    <circle cx="286" cy="240" r="7"/>
  </g>

  <!-- Throat & Handle -->
  <path d="M242 325 L242 410 Q242 420 256 420 Q270 420 270 410 L270 325 Z" fill="#10b981" stroke="#6ffbbe" stroke-width="2"/>
  <line x1="242" y1="350" x2="270" y2="350" stroke="#003824" stroke-width="3"/>
  <line x1="242" y1="375" x2="270" y2="375" stroke="#003824" stroke-width="3"/>
  <line x1="242" y1="400" x2="270" y2="400" stroke="#003824" stroke-width="3"/>

  <!-- Tennis/Padel Ball -->
  <circle cx="370" cy="180" r="34" fill="url(#ballGrad)" stroke="#4edea3" stroke-width="2" filter="drop-shadow(0 0 10px rgba(16, 185, 129, 0.5))"/>
  <path d="M350 162 C362 174 362 186 350 198" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
  <path d="M390 162 C378 174 378 186 390 198" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
</svg>
